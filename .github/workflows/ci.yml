name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix backend install --omit=optional
      - run: npm --prefix backend test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/cm_test
          JWT_SECRET: ci-secret-ci-secret-ci-secret-123456
      - run: npm --prefix react-frontend install
      - run: npm --prefix react-frontend run build
